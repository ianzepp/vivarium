name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build vivi-pty
        run: cargo build --release --target ${{ matrix.target }} -p vivi-pty

      - name: Package binaries
        run: |
          cd target/${{ matrix.target }}/release
          tar czf vivi-${{ matrix.target }}.tar.gz vivi vivi-pty
          mv vivi-${{ matrix.target }}.tar.gz ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vivi-${{ matrix.target }}
          path: vivi-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vivi-aarch64-apple-darwin/vivi-aarch64-apple-darwin.tar.gz
            vivi-x86_64-apple-darwin/vivi-x86_64-apple-darwin.tar.gz
            vivi-x86_64-unknown-linux-gnu/vivi-x86_64-unknown-linux-gnu.tar.gz
          generate_release_notes: true
